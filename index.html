  <!-- Script de filtro -->
  <script>
    const subcategories = {
      xperiun: ['powerbi', 'linkedin'],
      alura: ['python', 'sql', 'excel'],
      udemy: ['excel', 'powerbi', 'python']
    };

    let selectedSchool = null;

    function selectSchool(school) {
      selectedSchool = school;
      filterCerts(school);
      showSubFilters(school);
    }

    function showSubFilters(school) {
      const container = document.getElementById('subfilters');
      container.innerHTML = '';
      container.style.display = 'flex';

      subcategories[school].forEach(tech => {
        const btn = document.createElement('button');
        btn.innerText = tech.charAt(0).toUpperCase() + tech.slice(1);
        btn.onclick = () => filterCerts(`${school} ${tech}`);
        container.appendChild(btn);
      });
    }

    function filterCerts(category) {
        const cards = document.querySelectorAll('.cert-card');
        const subfilterBox = document.getElementById('subfilters');
      
        cards.forEach(card => {
          const categories = card.getAttribute('data-category');
          if (category === 'all' || categories.includes(category)) {
            card.style.display = 'block';
          } else {
            card.style.display = 'none';
          }
        });
      
        // Se for "Todos", esconder subfiltros
        if (category === 'all') {
          subfilterBox.style.display = 'none';
          subfilterBox.innerHTML = '';
        }
      }
  </script>
